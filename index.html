<div id="splash" aria-hidden="true"><div class="wordmark">MIMI<span class="wm-bell"></span>GYM</div></div>

    </button>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav id="tabs" aria-label="Navegación principal">
    <a href="#/hoy" data-tab="hoy"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>Hoy</span></a>

  </nav>
  <div id="rest" class="rest-pill" hidden></div>
